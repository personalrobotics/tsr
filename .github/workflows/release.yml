name: Release

# Tag-driven release pipeline.
#
# Tag patterns:
#   v*rc*    -> build sdist + wheel, publish to TestPyPI (dry run)
#   v*       -> build sdist + wheel, publish to real PyPI + GitHub Release
#   (manual workflow_dispatch also builds + publishes to TestPyPI)
#
# The version comes from the tag (hatch-vcs), so an rc tag necessarily builds an rc
# artifact and TestPyPI always receives a pre-release. A guard re-checks that the
# built artifact matches the tag before any publish job runs.
#
# Auth: Trusted Publishing (PyPI / TestPyPI OIDC). No API tokens in CI.
# The publish jobs run inside named GitHub environments (`release` /
# `testpypi-release`) so the org's environment-protection rules apply.
#
# sstsr is pure Python, so a single `uv build` produces both artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # When building from a tag, the tag IS the version. `git describe` has to choose
      # when several tags point at one commit -- the normal rc -> final flow, since the
      # release usually sits on the same commit as its candidate -- and it resolved to
      # the rc in CI while resolving to the final tag locally, so the version is pinned
      # from the ref rather than inferred.
      #
      # It must be the GENERIC setuptools-scm variable: hatch-vcs does not pass the
      # distribution name through, so the per-distribution
      # SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SSTSR form is silently ignored. Verified by
      # building with each set to 9.9.9: the per-dist form produced 2.3.0 (from
      # describe), the generic form produced 9.9.9.
      - name: Build
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/v*)
              export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}"
              echo "building tag ${GITHUB_REF_NAME} as version ${SETUPTOOLS_SCM_PRETEND_VERSION}"
              ;;
          esac
          uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # The version is derived from the tag, so a mismatch means the tag was not
      # what was built (dirty tree, shallow clone, wrong ref). Fail before publishing.
      - name: Tag matches artifact version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          artifact="$(basename "$(ls dist/*.whl)" | cut -d- -f2)"
          echo "tag=$tag artifact=$artifact"
          if [ "$tag" != "$artifact" ]; then
            echo "::error::tag $tag does not match built version $artifact"
            exit 1
          fi

      # TestPyPI must only ever receive pre-releases, and PyPI only finals. The step
      # above already tied the artifact to the tag, so checking the tag is enough.
      - name: Tag kind matches its destination
        run: |
          set -euo pipefail
          artifact="$(basename "$(ls dist/*.whl)" | cut -d- -f2)"
          case "${GITHUB_REF_NAME}" in
            *rc*)
              case "$artifact" in
                *rc*) ;;
                *) echo "::error::rc tag ${GITHUB_REF_NAME} built a final artifact $artifact"; exit 1 ;;
              esac ;;
            v*)
              case "$artifact" in
                *rc*|*dev*) echo "::error::final tag ${GITHUB_REF_NAME} built pre-release $artifact"; exit 1 ;;
              esac ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish_testpypi:
    name: Publish → TestPyPI
    needs: build
    runs-on: ubuntu-latest
    # RC tags (e.g. v2.0.0rc1) and manual triggers. The real PyPI job runs on
    # non-RC v* tags only.
    if: contains(github.ref, 'rc') || github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi-release
      url: https://test.pypi.org/p/sstsr
    permissions:
      id-token: write  # Trusted Publishing OIDC
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish → PyPI
    needs: build
    runs-on: ubuntu-latest
    # Real PyPI: only on v* tags that DON'T contain 'rc' (e.g. v2.0.0).
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
    environment:
      name: release
      url: https://pypi.org/p/sstsr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create GitHub Release
    needs: publish_pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: sstsr ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
