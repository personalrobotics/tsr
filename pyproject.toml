[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sstsr"
# The git tag is the single source of truth for the version (hatch-vcs), so an rc tag
# builds an rc artifact: v2.2.0rc1 -> sstsr-2.2.0rc1. See docs/RELEASING.md.
dynamic = ["version"]
description = "Task Space Regions for grasp and placement planning (import as `tsr`)"
readme = "README.md"
license = "BSD-2-Clause"
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"}
]
maintainers = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["robotics", "motion-planning", "task-space-regions", "tsr"]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.112",
    "build>=1.0.0",
]
# The supported visualization backend. Both names install Viser: `viz` is kept so an
# existing `sstsr[viz]` install keeps working, and `viser` says what it is.
# Core sstsr never imports either.
viz = [
    "viser>=0.2.7",
]
viser = [
    "viser>=0.2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    # Only for scripts/render_readme_figures.py, which composes captured frames.
    "Pillow>=10.3.0",
]

[project.urls]
Homepage = "https://github.com/personalrobotics/sstsr"
Repository = "https://github.com/personalrobotics/sstsr"
Issues = "https://github.com/personalrobotics/sstsr/issues"

[tool.hatch.version]
source = "vcs"

# PyPI and TestPyPI reject local version segments (+g<sha>), so an untagged build
# (the manual workflow_dispatch dry run) still produces an uploadable 2.2.0rc2.dev0.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# Written at build time and shipped in the sdist and wheel, so a wheel can be built
# from an unpacked sdist (no .git present).
[tool.hatch.build.hooks.vcs]
version-file = "src/tsr/_version.py"

# Renders the C++ core's CMake package into tsr/cpp/ inside the wheel. The wheel stays
# py3-none-any: it carries the C++ sources and headers, not a compiled library, so a
# planner that links sstsr::sstsr_cpp compiles them into its own build. See docs/CPP.md.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tsr"]

# cpp/ is the source of truth for the C++ core, and tools/ + tests/reference/ hold the
# conformance corpus, so an sdist has to be able to rebuild and recheck both.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/cpp",
    "/tools",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/hatch_build.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/tsr"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The top-level __init__ is grouped by architecture layer (see docs/ARCHITECTURE.md),
# not alphabetically, so exempt it from import re-sorting (I001).
"src/tsr/__init__.py" = ["F401", "I001"]
"src/tsr/**/__init__.py" = ["F401"]
